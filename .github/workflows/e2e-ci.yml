name: E2E CI

# Playwright is slow and needs the whole stack, so it is kept off the pull_request path.
# It runs after merge to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install workspace
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      # CI-only values. Real environments get these from their own secret store; nothing here
      # is reused anywhere else.
      - name: Write .env for compose
        run: |
          cat > .env <<'ENV'
          POSTGRES_DB=unify
          POSTGRES_USER=unify
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_PORT=5432
          ASPNETCORE_ENVIRONMENT=Development
          API_PORT=5000
          ConnectionStrings__Unify=Host=postgres;Port=5432;Database=unify;Username=unify;Password=ci-only-password
          Database__RunMigrationsOnStartup=true
          Jwt__Issuer=http://localhost:5000
          Jwt__Audience=unify-stay
          Jwt__SigningKey=ci-only-signing-key-that-is-at-least-32-bytes-long
          Cors__AllowedOrigins__0=http://localhost:3000
          Cors__AllowedOrigins__1=http://localhost:3001
          NEXT_PUBLIC_API_URL=http://localhost:5000
          USER_PORTAL_PORT=3000
          ADMIN_PORTAL_PORT=3001
          ENV

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Show service state
        if: always()
        run: docker compose ps

      - name: Wait for the portals
        run: |
          for url in http://localhost:3000 http://localhost:3001 http://localhost:5000/health/live; do
            echo "waiting for $url"
            timeout 180 bash -c "until curl -sSf '$url' > /dev/null; do sleep 3; done"
          done

      - name: Run Playwright
        working-directory: src/frontend
        run: npm run e2e

      - name: Collect API logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 400

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
