name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - '.docker/user-portal.Dockerfile'
      - '.docker/admin-portal.Dockerfile'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'src/frontend/**'
      - '.docker/user-portal.Dockerfile'
      - '.docker/admin-portal.Dockerfile'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

defaults:
  run:
    working-directory: src/frontend

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      # `npm ci` so the lockfile is authoritative; a drifted lockfile fails here rather than
      # silently resolving to something different from what was tested locally.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000

  docker-images:
    name: Docker image builds
    if: false
    runs-on: ubuntu-latest
    # Image builds repeat the install and build from scratch, so only spend the runner time
    # once the fast checks have passed.
    needs: verify
    defaults:
      run:
        working-directory: .
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user-portal
            dockerfile: .docker/user-portal.Dockerfile
          - app: admin-portal
            dockerfile: .docker/admin-portal.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verification only - nothing is pushed.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: unify-${{ matrix.app }}:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:5000
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
