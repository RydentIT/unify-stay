# Local development stack for UnifyStay.
#
#   cp .env.example .env      # then edit if you like
#   docker compose up --build
#
# Ports: postgres 5432, api 5000, user-portal 3000, admin-portal 3001.
# All configuration comes from .env - nothing secret is written in this file.

name: unify-stay

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unify}
      POSTGRES_USER: ${POSTGRES_USER:-unify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env}
      # Without this, initdb picks a locale-dependent collation and index behaviour can
      # differ between a developer machine and CI.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied by postgres itself on FIRST INIT ONLY (empty volume). DbUp remains the
      # authority and re-applies the same scripts through its journal - which is safe because
      # every script in database/sql/ is written to be idempotent. Drop this mount if you
      # would rather DbUp be the only thing that ever touches the schema.
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unify} -d ${POSTGRES_DB:-unify}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Unify: ${ConnectionStrings__Unify:?ConnectionStrings__Unify is required}
      Database__RunMigrationsOnStartup: ${Database__RunMigrationsOnStartup:-true}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__SigningKey: ${Jwt__SigningKey:?Jwt__SigningKey is required - at least 32 bytes}
      Jwt__AccessTokenLifetimeMinutes: ${Jwt__AccessTokenLifetimeMinutes:-60}
      Jwt__PasswordChangeTokenLifetimeMinutes: ${Jwt__PasswordChangeTokenLifetimeMinutes:-10}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:-http://localhost:3000}
      Cors__AllowedOrigins__1: ${Cors__AllowedOrigins__1:-http://localhost:3001}
    ports:
      - "${API_PORT:-5000}:8080"
    healthcheck:
      # Liveness, not readiness: the API is considered up even while the database is not,
      # which is what lets the portals start and show a sensible error instead of hanging.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-portal:
    build:
      context: .
      dockerfile: .docker/user-portal.Dockerfile
      args:
        # Build-time, not run-time: NEXT_PUBLIC_* is inlined into the browser bundle.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${USER_PORTAL_PORT:-3000}:3000"

  admin-portal:
    build:
      context: .
      dockerfile: .docker/admin-portal.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${ADMIN_PORTAL_PORT:-3001}:3001"

volumes:
  postgres-data:
    driver: local
